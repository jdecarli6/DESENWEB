<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tarefas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tarefas Inteligentes</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="scroll" class="scroll">
        <header class="header">
          <div class="title-row">
            <h1>Tarefas</h1>
            <button id="btn-new" class="icon-btn" type="button" aria-label="Nova tarefa (detalhada)">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" /></svg>
            </button>
          </div>
          <p id="summary" class="summary" aria-live="polite"></p>

          <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none" /><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            <input id="search" type="search" placeholder="Buscar tarefas" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="Buscar tarefas" />
          </div>

          <div id="status" class="segmented" role="group" aria-label="Filtrar por situação">
            <button type="button" data-status="all" class="on">Todas</button>
            <button type="button" data-status="pending">Pendentes</button>
            <button type="button" data-status="done">Concluídas</button>
          </div>

          <div id="chips" class="chips" role="group" aria-label="Filtrar por categoria"></div>

          <div class="filters-row">
            <label>Prioridade
              <select id="f-priority">
                <option value="all">Todas</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </label>
            <label>Ordenar
              <select id="f-sort">
                <option value="smart">Inteligente</option>
                <option value="due">Prazo</option>
                <option value="priority">Prioridade</option>
                <option value="recent">Mais recentes</option>
              </select>
            </label>
          </div>
        </header>

        <main id="list" class="list" aria-live="polite"></main>
      </div>

      <form id="quick" class="quick" autocomplete="off">
        <input id="quick-input" type="text" placeholder="Ex.: Reunião amanhã 14h #trabalho !alta" enterkeyhint="send" aria-label="Adicionar tarefa rapidamente" maxlength="200" />
        <button type="submit" class="send" aria-label="Adicionar tarefa">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></svg>
        </button>
      </form>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- Formulário de criar/editar -->
    <div id="sheet" class="overlay" hidden>
      <form id="task-form" class="sheet" novalidate autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <button type="button" id="f-cancel" class="link">Cancelar</button>
          <h2 id="sheet-title">Nova tarefa</h2>
          <button type="submit" class="link strong">Salvar</button>
        </div>
        <div class="sheet-body">
          <label class="field">
            <span class="label">Título</span>
            <input id="t-title" type="text" maxlength="120" placeholder="O que precisa ser feito?" />
          </label>
          <label class="field">
            <span class="label">Notas</span>
            <textarea id="t-notes" rows="3" maxlength="2000" placeholder="Detalhes (opcional)"></textarea>
          </label>
          <div class="field">
            <span class="label">Categoria <em id="hint-cat" class="hint" hidden>✨ sugerida</em></span>
            <div id="t-cats" class="chips wrap" role="radiogroup" aria-label="Categoria"></div>
          </div>
          <div class="field">
            <span class="label">Prioridade <em id="hint-pri" class="hint" hidden>✨ sugerida</em></span>
            <div id="t-pri" class="segmented" role="radiogroup" aria-label="Prioridade"></div>
          </div>
          <div class="row">
            <label class="field"><span class="label">Data</span><input id="t-due" type="date" /></label>
            <label class="field"><span class="label">Hora</span><input id="t-time" type="time" /></label>
          </div>
          <button type="button" id="t-clear-due" class="link small">Remover prazo</button>
          <p id="t-error" class="error" role="alert" hidden></p>
          <button type="button" id="t-delete" class="danger" hidden>Excluir tarefa</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
