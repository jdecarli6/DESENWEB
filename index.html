<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tarefas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gerenciador de Tarefas Inteligente</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <ion-app>
      <div class="ion-page" id="main-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>Tarefas</ion-title>
          </ion-toolbar>
          <ion-toolbar>
            <ion-searchbar id="search" placeholder="Buscar tarefas" aria-label="Buscar tarefas" debounce="0" autocapitalize="off" enterkeyhint="search"></ion-searchbar>
          </ion-toolbar>
        </ion-header>

        <ion-content id="content">
          <div class="pad">
            <p id="summary" class="summary" aria-live="polite"></p>

            <ion-segment id="status" value="all" aria-label="Filtrar por situação">
              <ion-segment-button value="all"><ion-label>Todas</ion-label></ion-segment-button>
              <ion-segment-button value="pending"><ion-label>Pendentes</ion-label></ion-segment-button>
              <ion-segment-button value="done"><ion-label>Concluídas</ion-label></ion-segment-button>
            </ion-segment>

            <div id="chips" class="chips" role="group" aria-label="Filtrar por categoria"></div>
          </div>

          <ion-list inset="true" class="filters">
            <ion-item>
              <ion-select id="f-priority" label="Prioridade" interface="popover" value="all">
                <ion-select-option value="all">Todas</ion-select-option>
                <ion-select-option value="alta">Alta</ion-select-option>
                <ion-select-option value="media">Média</ion-select-option>
                <ion-select-option value="baixa">Baixa</ion-select-option>
              </ion-select>
            </ion-item>
            <ion-item>
              <ion-select id="f-sort" label="Ordenar" interface="popover" value="smart">
                <ion-select-option value="smart">Inteligente</ion-select-option>
                <ion-select-option value="due">Prazo</ion-select-option>
                <ion-select-option value="priority">Prioridade</ion-select-option>
                <ion-select-option value="recent">Mais recentes</ion-select-option>
              </ion-select>
            </ion-item>
          </ion-list>

          <p id="swipe-hint" class="swipe-hint" hidden>Toque numa tarefa para editar · arraste para a esquerda para excluir</p>
          <ion-list id="list" inset="true" aria-label="Tarefas"></ion-list>
          <div id="empty" class="empty" aria-live="polite" hidden></div>

          <ion-fab slot="fixed" vertical="bottom" horizontal="end">
            <ion-fab-button id="btn-new" aria-label="Nova tarefa (detalhada)">
              <ion-icon name="add" aria-hidden="true"></ion-icon>
            </ion-fab-button>
          </ion-fab>
        </ion-content>

        <ion-footer id="quick-footer">
          <ion-toolbar>
            <form id="quick" class="quick" autocomplete="off">
              <ion-input id="quick-input" placeholder="Ex.: Reunião amanhã 14h #trabalho !alta" enterkeyhint="send" aria-label="Adicionar tarefa rapidamente" maxlength="200" fill="outline" shape="round"></ion-input>
              <ion-button type="submit" shape="round" aria-label="Adicionar tarefa">
                <ion-icon slot="icon-only" name="arrow-up" aria-hidden="true"></ion-icon>
              </ion-button>
            </form>
          </ion-toolbar>
        </ion-footer>
      </div>

      <!-- Formulário de criar/editar -->
      <ion-modal id="sheet" aria-labelledby="sheet-title">
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button id="f-cancel">Cancelar</ion-button>
            </ion-buttons>
            <ion-title id="sheet-title">Nova tarefa</ion-title>
            <ion-buttons slot="end">
              <ion-button id="f-save" strong="true">Salvar</ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <form id="task-form" novalidate autocomplete="off">
            <ion-list inset="true" class="form-list">
              <ion-item>
                <ion-input id="t-title" label="Título" label-placement="stacked" maxlength="120" placeholder="O que precisa ser feito?"></ion-input>
              </ion-item>
              <ion-item>
                <ion-textarea id="t-notes" label="Notas" label-placement="stacked" rows="3" auto-grow="true" maxlength="2000" placeholder="Detalhes (opcional)"></ion-textarea>
              </ion-item>
            </ion-list>

            <div class="field">
              <span class="label" id="lbl-cat">Categoria <em id="hint-cat" class="hint" hidden>✨ sugerida</em></span>
              <div id="t-cats" class="chips wrap" role="radiogroup" aria-labelledby="lbl-cat"></div>
            </div>

            <div class="field">
              <span class="label" id="lbl-pri">Prioridade <em id="hint-pri" class="hint" hidden>✨ sugerida</em></span>
              <ion-segment id="t-pri" value="media" aria-labelledby="lbl-pri">
                <ion-segment-button value="alta"><ion-label>Alta</ion-label></ion-segment-button>
                <ion-segment-button value="media"><ion-label>Média</ion-label></ion-segment-button>
                <ion-segment-button value="baixa"><ion-label>Baixa</ion-label></ion-segment-button>
              </ion-segment>
            </div>

            <ion-list inset="true" class="form-list">
              <ion-item>
                <ion-input id="t-due" type="date" label="Data" label-placement="stacked"></ion-input>
              </ion-item>
              <ion-item>
                <ion-input id="t-time" type="time" label="Hora" label-placement="stacked"></ion-input>
              </ion-item>
            </ion-list>
            <ion-button id="t-clear-due" fill="clear" size="small">Remover prazo</ion-button>

            <ion-text color="danger"><p id="t-error" class="error" role="alert" hidden></p></ion-text>
            <ion-button id="t-delete" expand="block" color="danger" fill="outline" hidden>Excluir tarefa</ion-button>
            <button type="submit" hidden></button>
          </form>
        </ion-content>
      </ion-modal>
    </ion-app>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
